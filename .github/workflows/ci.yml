name: Vic Academy ProjectHub validation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    env:
      MAILPIT_URL: http://127.0.0.1:8025
      APP_URL: https://127.0.0.1:3443
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Generate isolated test credentials and start PostgreSQL
        shell: bash
        run: |
          ci_database_password="$(openssl rand -hex 24)"
          echo "::add-mask::$ci_database_password"
          echo "DATABASE_URL=postgresql://projecthub:$ci_database_password@127.0.0.1:5432/projecthub_test" >> "$GITHUB_ENV"
          for setting in AUTH_SECRET ANALYTICS_SECRET CRON_SECRET DEV_SEED_PASSWORD; do
            ci_secret="$(openssl rand -hex 32)"
            echo "::add-mask::$ci_secret"
            echo "$setting=$ci_secret" >> "$GITHUB_ENV"
          done
          POSTGRES_PASSWORD="$ci_database_password" docker run -d --name projecthub-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD -e POSTGRES_USER=projecthub -e POSTGRES_DB=projecthub_test postgres:16
          for attempt in {1..30}; do
            if docker exec projecthub-postgres pg_isready -U projecthub -d projecthub_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run db:validate && npm run db:deploy && npm run db:seed
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run browser journeys against the production build
        run: |
          mkdir -p .next/standalone/public .next/standalone/.next/static
          cp -R public/. .next/standalone/public/
          cp -R .next/static/. .next/standalone/.next/static/
          export PROJECTHUB_TEST_TLS_KEY="$RUNNER_TEMP/projecthub-test-key.pem"
          export PROJECTHUB_TEST_TLS_CERT="$RUNNER_TEMP/projecthub-test-cert.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1" -keyout "$PROJECTHUB_TEST_TLS_KEY" -out "$PROJECTHUB_TEST_TLS_CERT"
          node tests/e2e/https-proxy.mjs &
          proxy_pid=$!
          node --import tsx scripts/email-worker.ts > email-worker.log 2>&1 &
          worker_pid=$!
          node --import tsx scripts/email-worker.ts > email-worker-2.log 2>&1 &
          second_worker_pid=$!
          trap 'kill "$proxy_pid" "$worker_pid" "$second_worker_pid" 2>/dev/null || true' EXIT
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-verification
          path: |
            playwright-report
            test-results
            email-worker*.log
